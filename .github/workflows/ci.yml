name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  # The Playwright version the lockfile pins, so the check runs in the image made for exactly that version.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')" >> "$GITHUB_OUTPUT"
  # Microsoft's Playwright image has the browsers and their system libraries built in: the check needs no apt, so an
  # outage of the Ubuntu mirrors can't fail it (ADR 0006). setup-node still pins .nvmrc's Node, whatever the image ships.
  check:
    needs: playwright
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # A release is exactly what package.json says it is: a tag that names another version builds nothing.
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')" || { echo "tag $GITHUB_REF_NAME does not match package.json $(node -p 'require("./package.json").version')"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      # The image is started once before it is pushed: an image that builds but cannot start must never reach a server.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: noticebox:smoke
      - name: The image starts and answers
        run: |
          docker run -d --name smoke -p 127.0.0.1:3000:3000 noticebox:smoke
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 401
          # Outgoing HTTPS trusts the system store: the server runs with --use-system-ca.
          docker inspect --format '{{json .Config.Cmd}}' noticebox:smoke | grep -q -- --use-system-ca
          docker logs smoke
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attached to the image in the registry: what it contains, and how and from which commit it was built.
          sbom: true
          provenance: mode=max
  # The GitHub release, once the image is pushed: its notes are the pull requests merged since the last tag.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
